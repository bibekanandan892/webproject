</g>
<text x="60" y="263" fill="#8B98A9">round 3</text>
<g fill="#64FFDA" text-anchor="middle">
<text x="224" y="263">the</text><text x="320" y="263">desk</text><text x="416" y="263">shuts</text><text x="512" y="263">six</text><text x="608" y="263">pm</text>
</g>
