<text x="224" y="115">?</text><text x="320" y="115">?</text><text x="416" y="115">?</text><text x="512" y="115">?</text><text x="608" y="115">?</text>
</g>
<g fill="#141C30" stroke="rgba(230,237,243,0.16)" stroke-width="2">
<rect x="276" y="160" width="88" height="44" rx="6"/><rect x="372" y="160" width="88" height="44" rx="6"/><rect x="468" y="160" width="88" height="44" rx="6"/>
</g>
<g fill="#64FFDA" fill-opacity="0.28" stroke="#64FFDA" stroke-width="2">
<rect x="180" y="160" width="88" height="44" rx="6"/><rect x="564" y="160" width="88" height="44" rx="6"/>
</g>
<text x="60" y="189" fill="#8B98A9">round 1</text>
<g text-anchor="middle">
<text x="224" y="189" fill="#64FFDA">the</text><text x="320" y="189" fill="#8B98A9" fill-opacity="0.55">?</text><text x="416" y="189" fill="#8B98A9" fill-opacity="0.55">?</text><text x="512" y="189" fill="#8B98A9" fill-opacity="0.55">?</text><text x="608" y="189" fill="#64FFDA">pm</text>
