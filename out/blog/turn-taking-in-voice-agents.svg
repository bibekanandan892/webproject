<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Turn-taking: two speech tracks, user and agent, alternating with short gaps between turns.">
<defs>
  <radialGradient id="glow" cx="50%" cy="14%" r="80%">
    <stop offset="0%" stop-color="#141413" stop-opacity="0.12"/>
    <stop offset="100%" stop-color="#141413" stop-opacity="0"/>
  </radialGradient>
</defs>
<rect width="800" height="450" fill="#F0EEE6"/>
<rect width="800" height="450" fill="url(#glow)"/>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19">
<text x="60" y="140" fill="#5E5D59">user</text><text x="60" y="240" fill="#141413">agent</text>
</g>
<path d="M140 134 H740 M140 234 H740" stroke="#141413" stroke-opacity="0.15" stroke-width="2"/>
<g fill="#5E5D59" fill-opacity="0.4"><rect x="140" y="112" width="160" height="44" rx="8"/><rect x="306" y="112" width="40" height="44" rx="8"/><rect x="520" y="112" width="120" height="44" rx="8"/></g>
<g fill="#141413" fill-opacity="0.7"><rect x="372" y="212" width="130" height="44" rx="8"/><rect x="664" y="212" width="76" height="44" rx="8"/></g>
<g stroke="#141413" stroke-width="2" stroke-dasharray="4 4"><path d="M346 104 V266"/><path d="M372 104 V266"/></g>
<text x="314" y="292" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#141413">~200 ms</text>
<text x="60" y="372" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#5E5D59">pausing or finished? silence can't tell</text>
<text x="52" y="424" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="25" font-weight="600" letter-spacing="2" fill="#141413" fill-opacity="0.9">turn-taking in voice agents</text>
</svg>
