<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Context compaction: a long run of old turns collapsing into a short summary while the recent turns are kept verbatim.">
<defs>
  <radialGradient id="glow" cx="50%" cy="14%" r="80%">
    <stop offset="0%" stop-color="#141413" stop-opacity="0.12"/>
    <stop offset="100%" stop-color="#141413" stop-opacity="0"/>
  </radialGradient>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#141413"/></marker>
</defs>
<rect width="800" height="450" fill="#F0EEE6"/>
<rect width="800" height="450" fill="url(#glow)"/>
<text x="60" y="100" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#5E5D59">before</text>
<g fill="#5E5D59" fill-opacity="0.2" stroke="rgba(20,20,19,0.18)" stroke-width="1.6">
<rect x="60" y="114" width="46" height="44" rx="5"/><rect x="112" y="114" width="46" height="44" rx="5"/><rect x="164" y="114" width="46" height="44" rx="5"/><rect x="216" y="114" width="46" height="44" rx="5"/><rect x="268" y="114" width="46" height="44" rx="5"/><rect x="320" y="114" width="46" height="44" rx="5"/><rect x="372" y="114" width="46" height="44" rx="5"/><rect x="424" y="114" width="46" height="44" rx="5"/><rect x="476" y="114" width="46" height="44" rx="5"/>
</g>
<g fill="#141413" fill-opacity="0.28" stroke="#141413" stroke-opacity="0.7" stroke-width="2">
<rect x="588" y="114" width="46" height="44" rx="5"/><rect x="640" y="114" width="46" height="44" rx="5"/><rect x="692" y="114" width="46" height="44" rx="5"/>
</g>
<text x="588" y="100" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#141413">recent</text>
<path d="M290 178 V228" stroke="#141413" stroke-opacity="0.6" stroke-width="2.5" marker-end="url(#a)"/>
<text x="310" y="212" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#141413">summarise</text>
<text x="60" y="258" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#5E5D59">after</text>
<rect x="60" y="272" width="120" height="44" rx="5" fill="#5E5D59" fill-opacity="0.26" stroke="rgba(20,20,19,0.3)" stroke-width="2"/>
<text x="120" y="300" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#5E5D59" text-anchor="middle">summary</text>
<g fill="#141413" fill-opacity="0.28" stroke="#141413" stroke-opacity="0.7" stroke-width="2">
<rect x="588" y="272" width="46" height="44" rx="5"/><rect x="640" y="272" width="46" height="44" rx="5"/><rect x="692" y="272" width="46" height="44" rx="5"/>
</g>
<path d="M196 294 H572" stroke="rgba(20,20,19,0.14)" stroke-width="2" stroke-dasharray="7 7"/>
<text x="260" y="286" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#5E5D59">room again</text>
<text x="60" y="372" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#5E5D59">and the next one summarises this one</text>
<text x="52" y="422" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="25" font-weight="600" letter-spacing="2" fill="#141413" fill-opacity="0.9">context compaction</text>
</svg>
