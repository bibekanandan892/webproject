<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="LangGraph: nodes joined by edges with a loop back, and a saved checkpoint beneath the current node.">
<defs>
  <radialGradient id="glow" cx="50%" cy="14%" r="80%">
    <stop offset="0%" stop-color="#64FFDA" stop-opacity="0.12"/>
    <stop offset="100%" stop-color="#64FFDA" stop-opacity="0"/>
  </radialGradient>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64FFDA"/></marker>
  <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8B98A9"/></marker>
</defs>
<rect width="800" height="450" fill="#0F1626"/>
<rect width="800" height="450" fill="url(#glow)"/>
<rect x="60" y="128" width="160" height="66" rx="10" fill="#141C30" stroke="rgba(230,237,243,0.22)" stroke-width="2.5"/>
<text x="140" y="168" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#8B98A9" text-anchor="middle">classify</text>
<path d="M232 161 H288" stroke="#64FFDA" stroke-opacity="0.7" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="300" y="128" width="160" height="66" rx="10" fill="#64FFDA" fill-opacity="0.3" stroke="#64FFDA" stroke-width="2.5"/>
<text x="380" y="168" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#64FFDA" text-anchor="middle" font-weight="600">ask model</text>
<path d="M472 161 H528" stroke="#64FFDA" stroke-opacity="0.7" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="540" y="128" width="160" height="66" rx="10" fill="#141C30" stroke="rgba(230,237,243,0.22)" stroke-width="2.5"/>
<text x="620" y="168" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#8B98A9" text-anchor="middle">run tool</text>
<path d="M620 202 V236 H380 V206" stroke="#8B98A9" stroke-opacity="0.55" stroke-width="2.5" fill="none" marker-end="url(#b)"/>
<text x="440" y="258" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#8B98A9">round again</text>
<path d="M380 202 V276" stroke="#64FFDA" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="6 5"/>
<rect x="248" y="280" width="264" height="46" rx="8" fill="#64FFDA" fill-opacity="0.16" stroke="#64FFDA" stroke-opacity="0.6" stroke-width="2"/>
<text x="380" y="310" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#64FFDA" text-anchor="middle">state + where we are</text>
<text x="60" y="374" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#8B98A9">the position is saved, so the run can stop</text>
<text x="52" y="422" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="25" font-weight="600" letter-spacing="2" fill="#64FFDA" fill-opacity="0.9">langgraph</text>
</svg>
