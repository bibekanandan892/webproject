<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Prompt injection: instructions and untrusted data arriving in one stream, with a code gate blocking the action at the end.">
<defs>
  <radialGradient id="glow" cx="50%" cy="14%" r="80%">
    <stop offset="0%" stop-color="#64FFDA" stop-opacity="0.12"/>
    <stop offset="100%" stop-color="#64FFDA" stop-opacity="0"/>
  </radialGradient>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8B98A9"/></marker>
</defs>
<rect width="800" height="450" fill="#0F1626"/>
<rect width="800" height="450" fill="url(#glow)"/>
<rect x="60" y="112" width="200" height="44" rx="7" fill="#64FFDA" fill-opacity="0.26" stroke="#64FFDA" stroke-opacity="0.7" stroke-width="2"/>
<text x="160" y="141" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#64FFDA" text-anchor="middle">your instructions</text>
<rect x="60" y="170" width="200" height="44" rx="7" fill="#8B98A9" fill-opacity="0.2" stroke="rgba(230,237,243,0.26)" stroke-width="2" stroke-dasharray="6 5"/>
<text x="160" y="199" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#8B98A9" text-anchor="middle">untrusted text</text>
<path d="M272 134 L328 158" stroke="#8B98A9" stroke-opacity="0.55" stroke-width="2.5" marker-end="url(#a)"/>
<path d="M272 192 L328 168" stroke="#8B98A9" stroke-opacity="0.55" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="340" y="136" width="150" height="56" rx="9" fill="#141C30" stroke="rgba(230,237,243,0.26)" stroke-width="2.5"/>
<text x="415" y="170" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#8B98A9" text-anchor="middle">one stream</text>
<path d="M502 164 H556" stroke="#8B98A9" stroke-opacity="0.55" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="568" y="136" width="172" height="56" rx="9" fill="#64FFDA" fill-opacity="0.32" stroke="#64FFDA" stroke-width="3"/>
<text x="654" y="170" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#64FFDA" text-anchor="middle" font-weight="600">a check in code</text>
<path d="M654 206 V262" stroke="#64FFDA" stroke-opacity="0.45" stroke-width="2.5" stroke-dasharray="6 6"/>
<rect x="568" y="274" width="172" height="52" rx="9" fill="#141C30" stroke="rgba(230,237,243,0.2)" stroke-width="2"/>
<text x="654" y="306" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#8B98A9" text-anchor="middle">the real action</text>
<text x="60" y="290" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#8B98A9">nothing marks one as authoritative</text>
<text x="60" y="374" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#8B98A9">a prompt is a request — code is a rule</text>
<text x="52" y="422" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="25" font-weight="600" letter-spacing="2" fill="#64FFDA" fill-opacity="0.9">prompt injection</text>
</svg>
