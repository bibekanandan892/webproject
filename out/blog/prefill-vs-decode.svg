<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Prefill vs decode: one wide block for the prompt read in a single pass, then a row of single tokens generated one at a time.">
<defs>
