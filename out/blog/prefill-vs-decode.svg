<path d="M424 289 H484" stroke="#8B98A9" stroke-opacity="0.6" stroke-width="2.5" marker-end="url(#a)"/>
<text x="500" y="296" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#8B98A9">memory</text>
<text x="60" y="368" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#8B98A9">opposite bottlenecks, one request</text>
<text x="52" y="418" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="25" font-weight="600" letter-spacing="2" fill="#64FFDA" fill-opacity="0.9">prefill vs decode</text>
</svg>
