    <stop offset="0%" stop-color="#64FFDA" stop-opacity="0.12"/>
    <stop offset="100%" stop-color="#64FFDA" stop-opacity="0"/>
  </radialGradient>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8B98A9"/></marker>
</defs>
<rect width="800" height="450" fill="#0F1626"/>
<rect width="800" height="450" fill="url(#glow)"/>
<text x="60" y="108" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#8B98A9">prefill — one pass, all at once</text>
<rect x="60" y="126" width="440" height="56" rx="8" fill="#64FFDA" fill-opacity="0.3" stroke="#64FFDA" stroke-width="2.5"/>
<g stroke="#64FFDA" stroke-opacity="0.4" stroke-width="1.5">
<path d="M104 126 V182"/><path d="M148 126 V182"/><path d="M192 126 V182"/><path d="M236 126 V182"/><path d="M280 126 V182"/><path d="M324 126 V182"/><path d="M368 126 V182"/><path d="M412 126 V182"/><path d="M456 126 V182"/>
</g>
<text x="524" y="162" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#64FFDA">compute</text>
<text x="60" y="248" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#8B98A9">decode — one token per pass</text>
<g fill="#64FFDA" fill-opacity="0.22" stroke="#64FFDA" stroke-opacity="0.6" stroke-width="2">
<rect x="60" y="266" width="40" height="46" rx="6"/><rect x="112" y="266" width="40" height="46" rx="6"/><rect x="164" y="266" width="40" height="46" rx="6"/><rect x="216" y="266" width="40" height="46" rx="6"/><rect x="268" y="266" width="40" height="46" rx="6"/><rect x="320" y="266" width="40" height="46" rx="6"/><rect x="372" y="266" width="40" height="46" rx="6"/>
