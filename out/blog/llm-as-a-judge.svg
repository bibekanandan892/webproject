<path d="M250 246 L322 212" stroke="#5E5D59" stroke-opacity="0.6" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="336" y="160" width="200" height="74" rx="10" fill="#141413" fill-opacity="0.28" stroke="#141413" stroke-width="2.5"/>
<text x="436" y="205" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" fill="#141413" text-anchor="middle" font-weight="600">judge</text>
