<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Cloud vs on-device: data travelling to a remote model in one case, and the model sitting inside the device in the other.">
<defs>
  <radialGradient id="glow" cx="50%" cy="14%" r="80%">
    <stop offset="0%" stop-color="#141413" stop-opacity="0.12"/>
    <stop offset="100%" stop-color="#141413" stop-opacity="0"/>
  </radialGradient>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5E5D59"/></marker>
</defs>
<rect width="800" height="450" fill="#F0EEE6"/>
<rect width="800" height="450" fill="url(#glow)"/>
<text x="60" y="94" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#5E5D59">cloud — the data travels</text>
<rect x="60" y="110" width="110" height="80" rx="10" fill="#FFFFFF" stroke="rgba(20,20,19,0.26)" stroke-width="2.5"/>
<text x="115" y="156" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#5E5D59" text-anchor="middle">device</text>
<path d="M182 138 H288" stroke="#5E5D59" stroke-opacity="0.6" stroke-width="2.5" marker-end="url(#a)"/>
<path d="M288 166 H182" stroke="#5E5D59" stroke-opacity="0.4" stroke-width="2.5" marker-end="url(#a)"/>
<text x="196" y="126" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#5E5D59">90 ms</text>
<rect x="300" y="110" width="160" height="80" rx="10" fill="#5E5D59" fill-opacity="0.2" stroke="rgba(20,20,19,0.3)" stroke-width="2.5"/>
<text x="380" y="156" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#5E5D59" text-anchor="middle">big model</text>
<text x="60" y="262" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#141413">on-device — the model travels</text>
<rect x="60" y="278" width="200" height="84" rx="10" fill="#141413" fill-opacity="0.14" stroke="#141413" stroke-opacity="0.7" stroke-width="2.5"/>
<rect x="86" y="300" width="148" height="42" rx="7" fill="#141413" fill-opacity="0.34" stroke="#141413" stroke-width="2"/>
<text x="160" y="328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#141413" text-anchor="middle">small model</text>
<text x="286" y="316" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#141413">nothing leaves</text>
<text x="286" y="342" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#5E5D59">— and 10% never update</text>
<text x="52" y="422" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="25" font-weight="600" letter-spacing="2" fill="#141413" fill-opacity="0.9">cloud vs on-device</text>
</svg>
