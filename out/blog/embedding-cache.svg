<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Embedding cache: a lookup that returns a stored vector on a hit and falls through to the model on a miss.">
<defs>
  <radialGradient id="glow" cx="50%" cy="14%" r="80%">
    <stop offset="0%" stop-color="#141413" stop-opacity="0.12"/>
    <stop offset="100%" stop-color="#141413" stop-opacity="0"/>
  </radialGradient>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#141413"/></marker>
  <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5E5D59"/></marker>
</defs>
<rect width="800" height="450" fill="#F0EEE6"/>
<rect width="800" height="450" fill="url(#glow)"/>
<rect x="60" y="140" width="160" height="70" rx="10" fill="#FFFFFF" stroke="rgba(20,20,19,0.22)" stroke-width="2.5"/>
<text x="140" y="182" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#5E5D59" text-anchor="middle">text</text>
<path d="M232 175 H292" stroke="#141413" stroke-opacity="0.7" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="306" y="140" width="180" height="70" rx="10" fill="#141413" fill-opacity="0.28" stroke="#141413" stroke-width="2.5"/>
<text x="396" y="182" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#141413" text-anchor="middle" font-weight="600">cache</text>
<path d="M498 165 H600" stroke="#141413" stroke-opacity="0.75" stroke-width="2.5" marker-end="url(#a)"/>
<text x="512" y="152" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#141413">hit — 61.9%</text>
<path d="M396 222 V286 H600" stroke="#5E5D59" stroke-opacity="0.55" stroke-width="2.5" fill="none" marker-end="url(#b)"/>
<text x="412" y="276" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#5E5D59">miss — call the model</text>
<rect x="614" y="140" width="126" height="52" rx="8" fill="#141413" fill-opacity="0.2" stroke="#141413" stroke-opacity="0.7" stroke-width="2"/>
<text x="677" y="173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#141413" text-anchor="middle">vector</text>
<rect x="614" y="260" width="126" height="52" rx="8" fill="#FFFFFF" stroke="rgba(20,20,19,0.2)" stroke-width="2"/>
<text x="677" y="293" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#5E5D59" text-anchor="middle">vector</text>
<text x="60" y="366" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#5E5D59">key = hash(text) + model + version</text>
<text x="52" y="418" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="25" font-weight="600" letter-spacing="2" fill="#141413" fill-opacity="0.9">embedding cache</text>
</svg>
