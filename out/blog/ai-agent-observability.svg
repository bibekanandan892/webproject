<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="AI agent observability: a trace shown as nested spans of different lengths stacked in time order.">
<defs>
  <radialGradient id="glow" cx="40%" cy="14%" r="82%">
    <stop offset="0%" stop-color="#141413" stop-opacity="0.12"/>
    <stop offset="100%" stop-color="#141413" stop-opacity="0"/>
  </radialGradient>
</defs>
<rect width="800" height="450" fill="#F0EEE6"/>
<rect width="800" height="450" fill="url(#glow)"/>
<text x="60" y="92" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#5E5D59">one run, span by span</text>
<rect x="60" y="110" width="680" height="30" rx="5" fill="#141413" fill-opacity="0.34" stroke="#141413" stroke-width="2"/>
<rect x="84" y="150" width="200" height="26" rx="4" fill="#141413" fill-opacity="0.24"/>
<rect x="300" y="150" width="150" height="26" rx="4" fill="#5E5D59" fill-opacity="0.28"/>
<rect x="466" y="150" width="250" height="26" rx="4" fill="#141413" fill-opacity="0.24"/>
<rect x="108" y="186" width="120" height="26" rx="4" fill="#5E5D59" fill-opacity="0.28"/>
<rect x="490" y="186" width="100" height="26" rx="4" fill="#5E5D59" fill-opacity="0.28"/>
<rect x="606" y="186" width="94" height="26" rx="4" fill="#141413" fill-opacity="0.24"/>
<rect x="512" y="222" width="60" height="26" rx="4" fill="#5E5D59" fill-opacity="0.28"/>
<text x="60" y="296" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#141413">each span carries its prompt and its result</text>
<text x="60" y="332" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#5E5D59">which is why it is 77x the data</text>
<text x="52" y="414" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="25" font-weight="600" letter-spacing="2" fill="#141413" fill-opacity="0.9">agent observability</text>
</svg>
