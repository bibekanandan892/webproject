<rect x="476" y="112" width="140" height="56" rx="9" fill="#64FFDA" fill-opacity="0.16" stroke="#64FFDA" stroke-opacity="0.65" stroke-width="2.5"/>
<text x="546" y="146" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#64FFDA" text-anchor="middle">observe</text>
<path d="M546 180 V212 H130 V174" stroke="#8B98A9" stroke-opacity="0.5" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
<text x="60" y="268" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#8B98A9">what the context carries, turn by turn</text>
