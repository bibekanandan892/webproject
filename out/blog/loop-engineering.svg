<rect x="98" y="282" width="30" height="16" rx="3"/><rect x="98" y="302" width="30" height="16" rx="3"/>
<rect x="136" y="282" width="30" height="16" rx="3"/><rect x="136" y="302" width="30" height="16" rx="3"/><rect x="136" y="322" width="30" height="16" rx="3"/>
<rect x="174" y="282" width="30" height="16" rx="3"/><rect x="174" y="302" width="30" height="16" rx="3"/><rect x="174" y="322" width="30" height="16" rx="3"/><rect x="174" y="342" width="30" height="16" rx="3"/>
<rect x="212" y="282" width="30" height="16" rx="3"/><rect x="212" y="302" width="30" height="16" rx="3"/><rect x="212" y="322" width="30" height="16" rx="3"/><rect x="212" y="342" width="30" height="16" rx="3"/><rect x="212" y="362" width="30" height="16" rx="3"/>
<rect x="250" y="282" width="30" height="16" rx="3"/><rect x="250" y="302" width="30" height="16" rx="3"/><rect x="250" y="322" width="30" height="16" rx="3"/><rect x="250" y="342" width="30" height="16" rx="3"/><rect x="250" y="362" width="30" height="16" rx="3"/><rect x="250" y="382" width="30" height="16" rx="3"/>
