<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="AI agent evaluation: a chain of steps where each is checked, with the completion rate falling as the chain gets longer.">
<defs>
  <radialGradient id="glow" cx="30%" cy="14%" r="82%">
    <stop offset="0%" stop-color="#141413" stop-opacity="0.12"/>
    <stop offset="100%" stop-color="#141413" stop-opacity="0"/>
  </radialGradient>
</defs>
<rect width="800" height="450" fill="#F0EEE6"/>
<rect width="800" height="450" fill="url(#glow)"/>
<g>
<rect x="60" y="150" width="86" height="60" rx="8" fill="#141413" fill-opacity="0.42" stroke="#141413" stroke-width="2.5"/>
<rect x="158" y="150" width="86" height="60" rx="8" fill="#141413" fill-opacity="0.36" stroke="#141413" stroke-opacity="0.85" stroke-width="2"/>
<rect x="256" y="150" width="86" height="60" rx="8" fill="#141413" fill-opacity="0.28" stroke="#141413" stroke-opacity="0.7" stroke-width="2"/>
<rect x="354" y="150" width="86" height="60" rx="8" fill="#141413" fill-opacity="0.2" stroke="#141413" stroke-opacity="0.55" stroke-width="2"/>
<rect x="452" y="150" width="86" height="60" rx="8" fill="#141413" fill-opacity="0.13" stroke="#141413" stroke-opacity="0.4" stroke-width="2"/>
<rect x="550" y="150" width="86" height="60" rx="8" fill="#141413" fill-opacity="0.08" stroke="#141413" stroke-opacity="0.25" stroke-width="2"/>
<rect x="648" y="150" width="86" height="60" rx="8" fill="#FFFFFF" stroke="rgba(20,20,19,0.12)" stroke-width="2"/>
</g>
<text x="60" y="128" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#141413">every step checked</text>
<text x="60" y="266" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#5E5D59">0.95 per step</text>
<text x="648" y="266" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#5E5D59" text-anchor="end">→ a third finish</text>
<text x="52" y="412" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="25" font-weight="600" letter-spacing="2" fill="#141413" fill-opacity="0.9">agent evaluation</text>
</svg>
