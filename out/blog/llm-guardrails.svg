<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="LLM guardrails: a check before the model and a check after it, with most blocked requests being legitimate.">
<defs>
  <radialGradient id="glow" cx="50%" cy="14%" r="80%">
    <stop offset="0%" stop-color="#64FFDA" stop-opacity="0.12"/>
    <stop offset="100%" stop-color="#64FFDA" stop-opacity="0"/>
  </radialGradient>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64FFDA"/></marker>
</defs>
<rect width="800" height="450" fill="#0F1626"/>
<rect width="800" height="450" fill="url(#glow)"/>
<rect x="60" y="132" width="120" height="54" rx="9" fill="#141C30" stroke="rgba(230,237,243,0.24)" stroke-width="2.5"/>
<text x="120" y="165" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#8B98A9" text-anchor="middle">request</text>
<path d="M192 159 H236" stroke="#64FFDA" stroke-opacity="0.7" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="248" y="126" width="34" height="66" rx="6" fill="#64FFDA" fill-opacity="0.34" stroke="#64FFDA" stroke-width="2.5"/>
<path d="M294 159 H338" stroke="#64FFDA" stroke-opacity="0.7" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="350" y="132" width="130" height="54" rx="9" fill="#141C30" stroke="rgba(230,237,243,0.24)" stroke-width="2.5"/>
<text x="415" y="165" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#8B98A9" text-anchor="middle">the model</text>
<path d="M492 159 H536" stroke="#64FFDA" stroke-opacity="0.7" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="548" y="126" width="34" height="66" rx="6" fill="#64FFDA" fill-opacity="0.34" stroke="#64FFDA" stroke-width="2.5"/>
<path d="M594 159 H638" stroke="#64FFDA" stroke-opacity="0.7" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="650" y="132" width="90" height="54" rx="9" fill="#141C30" stroke="rgba(230,237,243,0.2)" stroke-width="2"/>
<text x="695" y="165" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#8B98A9" text-anchor="middle">user</text>
<text x="238" y="112" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#64FFDA">in</text>
<text x="538" y="112" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#64FFDA">out</text>
<text x="60" y="256" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#8B98A9">of 1,267 blocked requests:</text>
<rect x="60" y="272" width="52" height="26" rx="4" fill="#64FFDA" fill-opacity="0.45" stroke="#64FFDA" stroke-width="2"/>
<rect x="116" y="272" width="191" height="26" rx="4" fill="#8B98A9" fill-opacity="0.24" stroke="rgba(230,237,243,0.26)" stroke-width="2"/>
<text x="322" y="291" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#8B98A9">997 did nothing wrong</text>
<text x="60" y="368" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#8B98A9">the false-positive rate is the number that matters</text>
<text x="52" y="420" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="25" font-weight="600" letter-spacing="2" fill="#64FFDA" fill-opacity="0.9">llm guardrails</text>
</svg>
