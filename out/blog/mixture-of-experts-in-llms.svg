<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Mixture of experts: an input token reaches a router, which dispatches it to two of six expert networks, whose outputs are combined by a weighted sum.">
<defs>
  <radialGradient id="glow" cx="50%" cy="16%" r="78%">
    <stop offset="0%" stop-color="#64FFDA" stop-opacity="0.12"/>
    <stop offset="100%" stop-color="#64FFDA" stop-opacity="0"/>
  </radialGradient>
</defs>
<rect width="800" height="450" fill="#0F1626"/>
<rect width="800" height="450" fill="url(#glow)"/>

<!-- input token -->
<rect x="320" y="34" width="160" height="42" rx="7" fill="#141C30" stroke="#64FFDA" stroke-opacity="0.55" stroke-width="1.5"/>
<text x="400" y="62" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" fill="#64FFDA" text-anchor="middle">input token</text>
<path d="M400 76 L400 100" stroke="#8B98A9" stroke-width="1.5" stroke-dasharray="3 3"/>

<!-- router -->
<polygon points="400,102 478,136 400,170 322,136" fill="#141C30" stroke="#64FFDA" stroke-width="1.6"/>
<text x="400" y="144" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" fill="#FFFFFF" text-anchor="middle" font-weight="600">router</text>

<!-- dispatch: two lit, four idle -->
<path d="M370 158 L110 222" stroke="rgba(230,237,243,0.09)" stroke-width="1.3"/>
<path d="M382 165 L226 222" stroke="rgba(230,237,243,0.09)" stroke-width="1.3"/>
<path d="M394 169 L342 222" stroke="#64FFDA" stroke-width="2.4"/>
<path d="M406 169 L458 222" stroke="rgba(230,237,243,0.09)" stroke-width="1.3"/>
<path d="M418 165 L574 222" stroke="#64FFDA" stroke-width="2.4"/>
<path d="M430 158 L690 222" stroke="rgba(230,237,243,0.09)" stroke-width="1.3"/>

<!-- experts -->
<rect x="60" y="222" width="100" height="64" rx="7" fill="#141C30" stroke="rgba(230,237,243,0.09)" stroke-width="1.5"/>
<text x="110" y="261" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" fill="#8B98A9" text-anchor="middle">E1</text>

<rect x="176" y="222" width="100" height="64" rx="7" fill="#141C30" stroke="rgba(230,237,243,0.09)" stroke-width="1.5"/>
<text x="226" y="261" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" fill="#8B98A9" text-anchor="middle">E2</text>

<rect x="292" y="222" width="100" height="64" rx="7" fill="#64FFDA" fill-opacity="0.18" stroke="#64FFDA" stroke-width="2"/>
<text x="342" y="261" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" fill="#64FFDA" text-anchor="middle" font-weight="600">E3</text>

<rect x="408" y="222" width="100" height="64" rx="7" fill="#141C30" stroke="rgba(230,237,243,0.09)" stroke-width="1.5"/>
<text x="458" y="261" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" fill="#8B98A9" text-anchor="middle">E4</text>

<rect x="524" y="222" width="100" height="64" rx="7" fill="#64FFDA" fill-opacity="0.18" stroke="#64FFDA" stroke-width="2"/>
<text x="574" y="261" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" fill="#64FFDA" text-anchor="middle" font-weight="600">E5</text>

<rect x="640" y="222" width="100" height="64" rx="7" fill="#141C30" stroke="rgba(230,237,243,0.09)" stroke-width="1.5"/>
<text x="690" y="261" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" fill="#8B98A9" text-anchor="middle">E6</text>

<text x="60" y="312" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#8B98A9">2 of 6 run</text>

<!-- combine -->
<path d="M342 286 L378 320" stroke="#64FFDA" stroke-width="2"/>
<path d="M574 286 L470 320" stroke="#64FFDA" stroke-width="2"/>
<rect x="310" y="320" width="180" height="44" rx="7" fill="#141C30" stroke="#64FFDA" stroke-width="1.6"/>
<text x="400" y="349" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#FFFFFF" text-anchor="middle">weighted sum</text>

<text x="52" y="412" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="25" font-weight="600" letter-spacing="2" fill="#64FFDA" fill-opacity="0.9">mixture of experts</text>
</svg>
