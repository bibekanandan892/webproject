<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="AI agent memory: four stacked layers of increasing size, from the context window at the top through short-term and long-term memory to external knowledge.">
<defs>
  <radialGradient id="glow" cx="30%" cy="14%" r="82%">
    <stop offset="0%" stop-color="#64FFDA" stop-opacity="0.12"/>
    <stop offset="100%" stop-color="#64FFDA" stop-opacity="0"/>
  </radialGradient>
</defs>
<rect width="800" height="450" fill="#0F1626"/>
<rect width="800" height="450" fill="url(#glow)"/>
<rect x="70" y="70" width="230" height="58" rx="8" fill="#64FFDA" fill-opacity="0.32" stroke="#64FFDA" stroke-width="2"/>
<text x="90" y="107" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" fill="#64FFDA" font-weight="600">context window</text>
<rect x="70" y="140" width="330" height="58" rx="8" fill="#64FFDA" fill-opacity="0.22" stroke="#64FFDA" stroke-opacity="0.7" stroke-width="2"/>
<text x="90" y="177" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" fill="#64FFDA" font-weight="600">short-term</text>
<rect x="70" y="210" width="430" height="58" rx="8" fill="#64FFDA" fill-opacity="0.14" stroke="#64FFDA" stroke-opacity="0.5" stroke-width="2"/>
<text x="90" y="247" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" fill="#64FFDA" font-weight="600">long-term</text>
<rect x="70" y="280" width="530" height="58" rx="8" fill="#141C30" stroke="rgba(230,237,243,0.14)" stroke-width="2"/>
<text x="90" y="317" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" fill="#8B98A9">external knowledge</text>
<text x="628" y="107" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#8B98A9">one call</text>
<text x="628" y="317" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#8B98A9">shared</text>
<text x="52" y="412" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="25" font-weight="600" letter-spacing="2" fill="#64FFDA" fill-opacity="0.9">agent memory</text>
</svg>
