<rect x="60" y="110" width="480" height="30" rx="6"/><rect x="60" y="146" width="480" height="30" rx="6"/><rect x="60" y="182" width="480" height="30" rx="6"/><rect x="60" y="218" width="480" height="30" rx="6"/><rect x="60" y="254" width="480" height="30" rx="6"/><rect x="60" y="290" width="480" height="30" rx="6"/>
</g>
