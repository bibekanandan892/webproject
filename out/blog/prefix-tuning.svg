<g fill="#141413" fill-opacity="0.45" stroke="#141413" stroke-width="2">
<rect x="556" y="110" width="88" height="30" rx="6"/><rect x="556" y="146" width="88" height="30" rx="6"/><rect x="556" y="182" width="88" height="30" rx="6"/><rect x="556" y="218" width="88" height="30" rx="6"/><rect x="556" y="254" width="88" height="30" rx="6"/><rect x="556" y="290" width="88" height="30" rx="6"/>
</g>
<g stroke="#141413" stroke-opacity="0.5" stroke-width="2">
<path d="M556 125 H544"/><path d="M556 161 H544"/><path d="M556 197 H544"/><path d="M556 233 H544"/><path d="M556 269 H544"/><path d="M556 305 H544"/>
