<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Reranker: a wide stack of retrieved documents narrowing to a few reordered results.">
<defs>
  <radialGradient id="glow" cx="50%" cy="14%" r="80%">
    <stop offset="0%" stop-color="#141413" stop-opacity="0.12"/>
    <stop offset="100%" stop-color="#141413" stop-opacity="0"/>
  </radialGradient>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5E5D59"/></marker>
</defs>
<rect width="800" height="450" fill="#F0EEE6"/>
<rect width="800" height="450" fill="url(#glow)"/>
<g fill="#5E5D59" fill-opacity="0.22" stroke="rgba(20,20,19,0.12)" stroke-width="1.5">
<rect x="60" y="80" width="210" height="26" rx="4"/><rect x="60" y="114" width="210" height="26" rx="4"/><rect x="60" y="148" width="210" height="26" rx="4"/><rect x="60" y="182" width="210" height="26" rx="4"/><rect x="60" y="216" width="210" height="26" rx="4"/><rect x="60" y="250" width="210" height="26" rx="4"/><rect x="60" y="284" width="210" height="26" rx="4"/><rect x="60" y="318" width="210" height="26" rx="4"/>
</g>
<text x="60" y="66" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#5E5D59">retrieved, roughly ordered</text>
<rect x="330" y="170" width="150" height="86" rx="10" fill="#141413" fill-opacity="0.28" stroke="#141413" stroke-width="2.5"/>
<text x="405" y="220" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#141413" text-anchor="middle" font-weight="600">reranker</text>
<path d="M278 213 H322" stroke="#5E5D59" stroke-opacity="0.6" stroke-width="2.5" marker-end="url(#a)"/>
<path d="M488 213 H532" stroke="#5E5D59" stroke-opacity="0.6" stroke-width="2.5" marker-end="url(#a)"/>
<g fill="#141413" fill-opacity="0.4" stroke="#141413" stroke-opacity="0.6" stroke-width="2">
<rect x="545" y="150" width="195" height="30" rx="5"/><rect x="545" y="190" width="195" height="30" rx="5"/><rect x="545" y="230" width="195" height="30" rx="5"/>
</g>
<text x="545" y="134" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#141413">actually relevant</text>
<text x="60" y="382" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#5E5D59">reads the question and the document together</text>
<text x="52" y="422" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="25" font-weight="600" letter-spacing="2" fill="#141413" fill-opacity="0.9">rerankers</text>
</svg>
