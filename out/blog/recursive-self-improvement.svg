<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Recursive self-improvement: a loop of propose, apply, evaluate and select, spiralling outward.">
<defs>
  <radialGradient id="glow" cx="50%" cy="14%" r="80%">
    <stop offset="0%" stop-color="#141413" stop-opacity="0.12"/>
    <stop offset="100%" stop-color="#141413" stop-opacity="0"/>
  </radialGradient>
</defs>
<rect width="800" height="450" fill="#F0EEE6"/>
<rect width="800" height="450" fill="url(#glow)"/>
<path d="M400 200 m-30 0 a30 30 0 1 1 60 0 a55 55 0 1 1 -110 0 a85 85 0 1 1 170 0 a120 120 0 1 1 -240 0" fill="none" stroke="#141413" stroke-opacity="0.65" stroke-width="4"/>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">
<text x="590" y="110" fill="#141413">propose</text>
<text x="590" y="150" fill="#141413">apply</text>
<text x="590" y="190" fill="#5E5D59">evaluate ← the weak step</text>
<text x="590" y="230" fill="#141413">select</text>
</g>
<text x="60" y="372" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#5E5D59">a −1% change is kept 36.5% of the time</text>
<text x="52" y="424" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="25" font-weight="600" letter-spacing="2" fill="#141413" fill-opacity="0.9">recursive self-improvement</text>
</svg>
