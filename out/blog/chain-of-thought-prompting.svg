<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Chain-of-thought prompting: a single answer token beside a row of reasoning tokens each getting its own pass through the model.">
<defs>
  <radialGradient id="glow" cx="50%" cy="14%" r="80%">
    <stop offset="0%" stop-color="#64FFDA" stop-opacity="0.12"/>
    <stop offset="100%" stop-color="#64FFDA" stop-opacity="0"/>
  </radialGradient>
</defs>
<rect width="800" height="450" fill="#0F1626"/>
<rect width="800" height="450" fill="url(#glow)"/>
<text x="60" y="96" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#8B98A9">straight to the answer</text>
<g fill="#8B98A9" fill-opacity="0.25" stroke="rgba(230,237,243,0.18)" stroke-width="1.5">
<rect x="60" y="112" width="56" height="12"/><rect x="60" y="128" width="56" height="12"/><rect x="60" y="144" width="56" height="12"/><rect x="60" y="160" width="56" height="12"/><rect x="60" y="176" width="56" height="12"/>
</g>
<text x="136" y="152" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#8B98A9">one pass</text>
<text x="60" y="250" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#64FFDA">write the steps</text>
<g fill="#64FFDA" fill-opacity="0.3" stroke="#64FFDA" stroke-opacity="0.5" stroke-width="1.5">
<rect x="60" y="266" width="56" height="12"/><rect x="60" y="282" width="56" height="12"/><rect x="60" y="298" width="56" height="12"/><rect x="60" y="314" width="56" height="12"/><rect x="60" y="330" width="56" height="12"/>
<rect x="126" y="266" width="56" height="12"/><rect x="126" y="282" width="56" height="12"/><rect x="126" y="298" width="56" height="12"/><rect x="126" y="314" width="56" height="12"/><rect x="126" y="330" width="56" height="12"/>
<rect x="192" y="266" width="56" height="12"/><rect x="192" y="282" width="56" height="12"/><rect x="192" y="298" width="56" height="12"/><rect x="192" y="314" width="56" height="12"/><rect x="192" y="330" width="56" height="12"/>
<rect x="258" y="266" width="56" height="12"/><rect x="258" y="282" width="56" height="12"/><rect x="258" y="298" width="56" height="12"/><rect x="258" y="314" width="56" height="12"/><rect x="258" y="330" width="56" height="12"/>
<rect x="324" y="266" width="56" height="12"/><rect x="324" y="282" width="56" height="12"/><rect x="324" y="298" width="56" height="12"/><rect x="324" y="314" width="56" height="12"/><rect x="324" y="330" width="56" height="12"/>
<rect x="390" y="266" width="56" height="12"/><rect x="390" y="282" width="56" height="12"/><rect x="390" y="298" width="56" height="12"/><rect x="390" y="314" width="56" height="12"/><rect x="390" y="330" width="56" height="12"/>
<rect x="456" y="266" width="56" height="12"/><rect x="456" y="282" width="56" height="12"/><rect x="456" y="298" width="56" height="12"/><rect x="456" y="314" width="56" height="12"/><rect x="456" y="330" width="56" height="12"/>
<rect x="522" y="266" width="56" height="12"/><rect x="522" y="282" width="56" height="12"/><rect x="522" y="298" width="56" height="12"/><rect x="522" y="314" width="56" height="12"/><rect x="522" y="330" width="56" height="12"/>
</g>
<text x="600" y="306" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#64FFDA">one each</text>
<text x="60" y="392" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#8B98A9">the tokens are the scratchpad</text>
<text x="52" y="430" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="25" font-weight="600" letter-spacing="2" fill="#64FFDA" fill-opacity="0.9">chain-of-thought prompting</text>
</svg>
