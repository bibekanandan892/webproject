<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="PyTorch: a forward chain of operations with gradients flowing back along the same path.">
<defs>
  <radialGradient id="glow" cx="50%" cy="14%" r="80%">
    <stop offset="0%" stop-color="#141413" stop-opacity="0.12"/>
    <stop offset="100%" stop-color="#141413" stop-opacity="0"/>
  </radialGradient>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#141413"/></marker>
  <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5E5D59"/></marker>
</defs>
<rect width="800" height="450" fill="#F0EEE6"/>
<rect width="800" height="450" fill="url(#glow)"/>
<g fill="#141413" fill-opacity="0.28" stroke="#141413" stroke-width="2.5">
<rect x="60" y="120" width="150" height="60" rx="10"/><rect x="238" y="120" width="150" height="60" rx="10"/><rect x="416" y="120" width="150" height="60" rx="10"/><rect x="594" y="120" width="146" height="60" rx="10"/>
</g>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#141413" text-anchor="middle">
<text x="135" y="158">x</text><text x="313" y="158">x³</text><text x="491" y="158">− 4x</text><text x="667" y="158">loss</text>
</g>
<path d="M220 150 H228" stroke="#141413" stroke-opacity="0.8" stroke-width="2.5" marker-end="url(#a)"/>
<path d="M398 150 H406" stroke="#141413" stroke-opacity="0.8" stroke-width="2.5" marker-end="url(#a)"/>
<path d="M576 150 H584" stroke="#141413" stroke-opacity="0.8" stroke-width="2.5" marker-end="url(#a)"/>
<text x="60" y="102" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#141413">forward — recorded as it runs</text>
<path d="M594 248 H570" stroke="#5E5D59" stroke-opacity="0.6" stroke-width="2.5" marker-end="url(#b)"/>
<path d="M416 248 H392" stroke="#5E5D59" stroke-opacity="0.6" stroke-width="2.5" marker-end="url(#b)"/>
<path d="M238 248 H214" stroke="#5E5D59" stroke-opacity="0.6" stroke-width="2.5" marker-end="url(#b)"/>
<g stroke="#5E5D59" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="5 5">
<path d="M667 190 V236"/><path d="M491 190 V236"/><path d="M313 190 V236"/><path d="M135 190 V236"/>
</g>
<text x="60" y="292" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#5E5D59">backward — the same edges in reverse</text>
<text x="60" y="360" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#5E5D59">the graph exists because the code ran</text>
<text x="52" y="414" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="25" font-weight="600" letter-spacing="2" fill="#141413" fill-opacity="0.9">pytorch</text>
</svg>
