<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="RLHF: two responses compared by a person, feeding a reward model that scores a language model's output during training.">
<defs>
  <radialGradient id="glow" cx="50%" cy="14%" r="80%">
    <stop offset="0%" stop-color="#64FFDA" stop-opacity="0.12"/>
    <stop offset="100%" stop-color="#64FFDA" stop-opacity="0"/>
  </radialGradient>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8B98A9"/></marker>
</defs>
<rect width="800" height="450" fill="#0F1626"/>
<rect width="800" height="450" fill="url(#glow)"/>
<rect x="60" y="96" width="190" height="60" rx="9" fill="#64FFDA" fill-opacity="0.3" stroke="#64FFDA" stroke-width="2.5"/>
<text x="155" y="134" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" fill="#64FFDA" text-anchor="middle" font-weight="600">answer A</text>
<rect x="60" y="184" width="190" height="60" rx="9" fill="#141C30" stroke="rgba(230,237,243,0.16)" stroke-width="2"/>
<text x="155" y="222" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" fill="#8B98A9" text-anchor="middle">answer B</text>
<text x="290" y="178" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="30" fill="#64FFDA">A ≻ B</text>
<path d="M420 170 H500" stroke="#8B98A9" stroke-opacity="0.6" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="520" y="140" width="220" height="60" rx="9" fill="#64FFDA" fill-opacity="0.2" stroke="#64FFDA" stroke-opacity="0.7" stroke-width="2"/>
<text x="630" y="178" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#64FFDA" text-anchor="middle">reward model</text>
<path d="M630 200 V262" stroke="#8B98A9" stroke-opacity="0.6" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="520" y="272" width="220" height="60" rx="9" fill="#141C30" stroke="rgba(230,237,243,0.16)" stroke-width="2"/>
<text x="630" y="310" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#8B98A9" text-anchor="middle">tune the model</text>
<text x="60" y="300" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#8B98A9">people compare,</text>
<text x="60" y="328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#8B98A9">they do not score</text>
<text x="52" y="412" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="25" font-weight="600" letter-spacing="2" fill="#64FFDA" fill-opacity="0.9">rlhf</text>
</svg>
