<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Gradient descent: a parabola with marked points stepping down the right-hand slope towards the minimum, the gaps between them shrinking each step.">
<defs>
  <radialGradient id="glow" cx="60%" cy="14%" r="80%">
    <stop offset="0%" stop-color="#141413" stop-opacity="0.12"/>
    <stop offset="100%" stop-color="#141413" stop-opacity="0"/>
  </radialGradient>
</defs>
<rect width="800" height="450" fill="#F0EEE6"/>
<rect width="800" height="450" fill="url(#glow)"/>

<!-- baseline -->
<path d="M60 330 H760" stroke="rgba(20,20,19,0.09)" stroke-width="1.5"/>

<!-- parabola: minimum at x=300, y=330 -->
<path d="M96 90 L120 118 L144 145 L168 169 L192 191 L216 211 L240 229 L264 245 L288 258 L300 264 L312 258 L336 245 L360 229 L384 211 L408 191 L432 169 L456 145 L480 118 L504 90 L528 60 L540 44"
      fill="none" stroke="#141413" stroke-opacity="0.5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

<!-- descending steps on the right slope -->
<circle cx="528" cy="60" r="9" fill="#141413" fill-opacity="0.9"/>
<circle cx="480" cy="118" r="9" fill="#141413" fill-opacity="0.75"/>
<circle cx="432" cy="169" r="9" fill="#141413" fill-opacity="0.6"/>
<circle cx="384" cy="211" r="9" fill="#141413" fill-opacity="0.48"/>
<circle cx="348" cy="238" r="9" fill="#141413" fill-opacity="0.38"/>
<circle cx="322" cy="253" r="8" fill="#141413" fill-opacity="0.3"/>

<!-- minimum marker -->
<path d="M300 264 V300" stroke="rgba(20,20,19,0.18)" stroke-width="1.5" stroke-dasharray="4 4"/>
<circle cx="300" cy="264" r="7" fill="#F0EEE6" stroke="#141413" stroke-width="2.5"/>

<text x="60" y="130" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#5E5D59">loss</text>
<text x="240" y="322" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#5E5D59">minimum</text>
<text x="556" y="68" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#141413">start</text>

<text x="52" y="412" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="25" font-weight="600" letter-spacing="2" fill="#141413" fill-opacity="0.9">gradient descent</text>
</svg>
