<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Grouped query attention: eight query heads split into two groups, each group sharing a single key-value set below it.">
<defs>
  <radialGradient id="glow" cx="50%" cy="14%" r="80%">
    <stop offset="0%" stop-color="#141413" stop-opacity="0.12"/>
    <stop offset="100%" stop-color="#141413" stop-opacity="0"/>
  </radialGradient>
</defs>
<rect width="800" height="450" fill="#F0EEE6"/>
<rect width="800" height="450" fill="url(#glow)"/>

<text x="60" y="86" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#5E5D59">8 queries</text>

<!-- query heads -->
<rect x="60" y="104" width="72" height="52" rx="6" fill="#141413" fill-opacity="0.16" stroke="#141413" stroke-opacity="0.5" stroke-width="1.5"/>
<rect x="148" y="104" width="72" height="52" rx="6" fill="#141413" fill-opacity="0.16" stroke="#141413" stroke-opacity="0.5" stroke-width="1.5"/>
<rect x="236" y="104" width="72" height="52" rx="6" fill="#141413" fill-opacity="0.16" stroke="#141413" stroke-opacity="0.5" stroke-width="1.5"/>
<rect x="324" y="104" width="72" height="52" rx="6" fill="#141413" fill-opacity="0.16" stroke="#141413" stroke-opacity="0.5" stroke-width="1.5"/>
<rect x="424" y="104" width="72" height="52" rx="6" fill="#141413" fill-opacity="0.16" stroke="#141413" stroke-opacity="0.5" stroke-width="1.5"/>
<rect x="512" y="104" width="72" height="52" rx="6" fill="#141413" fill-opacity="0.16" stroke="#141413" stroke-opacity="0.5" stroke-width="1.5"/>
<rect x="600" y="104" width="72" height="52" rx="6" fill="#141413" fill-opacity="0.16" stroke="#141413" stroke-opacity="0.5" stroke-width="1.5"/>
<rect x="688" y="104" width="72" height="52" rx="6" fill="#141413" fill-opacity="0.16" stroke="#141413" stroke-opacity="0.5" stroke-width="1.5"/>

<!-- funnel into two groups -->
<path d="M96 156 L228 224 M184 156 L228 224 M272 156 L228 224 M360 156 L228 224" stroke="#141413" stroke-opacity="0.45" stroke-width="2"/>
<path d="M460 156 L592 224 M548 156 L592 224 M636 156 L592 224 M724 156 L592 224" stroke="#141413" stroke-opacity="0.45" stroke-width="2"/>

<!-- shared kv per group -->
<rect x="60" y="224" width="336" height="62" rx="8" fill="#141413" fill-opacity="0.2" stroke="#141413" stroke-width="2"/>
<text x="228" y="262" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" fill="#141413" text-anchor="middle" font-weight="600">shared k / v</text>

<rect x="424" y="224" width="336" height="62" rx="8" fill="#141413" fill-opacity="0.2" stroke="#141413" stroke-width="2"/>
<text x="592" y="262" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" fill="#141413" text-anchor="middle" font-weight="600">shared k / v</text>

<text x="60" y="320" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#5E5D59">2 groups, 4 heads each</text>

<text x="52" y="412" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="25" font-weight="600" letter-spacing="2" fill="#141413" fill-opacity="0.9">grouped query attention</text>
</svg>
