<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="EAGLE: a drafter taking the previous hidden state and the sampled token and predicting the next hidden state.">
<defs>
  <radialGradient id="glow" cx="50%" cy="14%" r="80%">
    <stop offset="0%" stop-color="#141413" stop-opacity="0.12"/>
    <stop offset="100%" stop-color="#141413" stop-opacity="0"/>
  </radialGradient>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#141413"/></marker>
  <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5E5D59"/></marker>
</defs>
<rect width="800" height="450" fill="#F0EEE6"/>
<rect width="800" height="450" fill="url(#glow)"/>
<text x="60" y="96" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#5E5D59">guessing the sampled token</text>
<rect x="60" y="110" width="110" height="42" rx="7" fill="#FFFFFF" stroke="rgba(20,20,19,0.24)" stroke-width="2.5"/>
<text x="115" y="137" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#5E5D59" text-anchor="middle">h(t)</text>
<path d="M182 131 H222" stroke="#5E5D59" stroke-opacity="0.6" stroke-width="2.5" marker-end="url(#b)"/>
<g fill="#5E5D59" fill-opacity="0.2" stroke="rgba(20,20,19,0.2)" stroke-width="2">
<rect x="234" y="96" width="90" height="26" rx="5"/><rect x="234" y="128" width="90" height="26" rx="5"/><rect x="234" y="160" width="90" height="26" rx="5"/>
</g>
<text x="342" y="126" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#5E5D59">4.3 plausible —</text>
<text x="342" y="152" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#5E5D59">one is drawn at random</text>
<text x="60" y="248" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#141413">guessing the next state</text>
<rect x="60" y="262" width="110" height="42" rx="7" fill="#141413" fill-opacity="0.28" stroke="#141413" stroke-width="2.5"/>
<text x="115" y="289" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#141413" text-anchor="middle">h(t)</text>
<rect x="60" y="316" width="110" height="42" rx="7" fill="#141413" fill-opacity="0.28" stroke="#141413" stroke-width="2.5"/>
<text x="115" y="343" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#141413" text-anchor="middle">x(t+1)</text>
<path d="M182 285 L244 300" stroke="#141413" stroke-opacity="0.8" stroke-width="2.5" marker-end="url(#a)"/>
<path d="M182 335 L244 316" stroke="#141413" stroke-opacity="0.8" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="256" y="286" width="130" height="44" rx="8" fill="#141413" fill-opacity="0.45" stroke="#141413" stroke-width="2.5"/>
<text x="321" y="314" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#141413" text-anchor="middle">h(t+1)</text>
<text x="404" y="302" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#141413">one answer —</text>
<text x="404" y="328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#141413">nothing to guess</text>
<text x="60" y="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#5E5D59">2.5 tokens per pass becomes 3.5</text>
<text x="52" y="436" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="25" font-weight="600" letter-spacing="2" fill="#141413" fill-opacity="0.9">decoding eagle</text>
</svg>
