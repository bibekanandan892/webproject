<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Semantic caching: a new question compared against stored questions, returning a cached answer above a similarity threshold.">
<defs>
  <radialGradient id="glow" cx="50%" cy="14%" r="80%">
    <stop offset="0%" stop-color="#141413" stop-opacity="0.12"/>
    <stop offset="100%" stop-color="#141413" stop-opacity="0"/>
  </radialGradient>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#141413"/></marker>
</defs>
<rect width="800" height="450" fill="#F0EEE6"/>
<rect width="800" height="450" fill="url(#glow)"/>
<rect x="60" y="150" width="170" height="58" rx="10" fill="#FFFFFF" stroke="rgba(20,20,19,0.24)" stroke-width="2.5"/>
<text x="145" y="186" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#5E5D59" text-anchor="middle">new question</text>
<path d="M242 179 H298" stroke="#141413" stroke-opacity="0.7" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="310" y="150" width="170" height="58" rx="10" fill="#141413" fill-opacity="0.3" stroke="#141413" stroke-width="2.5"/>
<text x="395" y="186" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#141413" text-anchor="middle" font-weight="600">how close?</text>
<path d="M492 166 H556" stroke="#141413" stroke-opacity="0.75" stroke-width="2.5" marker-end="url(#a)"/>
<text x="500" y="150" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#141413">0.94</text>
<rect x="568" y="140" width="172" height="52" rx="8" fill="#141413" fill-opacity="0.2" stroke="#141413" stroke-opacity="0.75" stroke-width="2"/>
<text x="654" y="173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#141413" text-anchor="middle">cached answer</text>
<path d="M395 220 V282 H556" stroke="#5E5D59" stroke-opacity="0.5" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
<text x="412" y="272" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#5E5D59">0.71</text>
<rect x="568" y="256" width="172" height="52" rx="8" fill="#FFFFFF" stroke="rgba(20,20,19,0.2)" stroke-width="2"/>
<text x="654" y="289" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#5E5D59" text-anchor="middle">call the model</text>
<text x="60" y="366" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#5E5D59">close is not the same as identical</text>
<text x="52" y="420" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="25" font-weight="600" letter-spacing="2" fill="#141413" fill-opacity="0.9">semantic caching</text>
</svg>
