<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Prompt caching: a long stable prefix block marked as reused and a short changing tail marked as read fresh.">
<defs>
  <radialGradient id="glow" cx="50%" cy="14%" r="80%">
    <stop offset="0%" stop-color="#141413" stop-opacity="0.12"/>
    <stop offset="100%" stop-color="#141413" stop-opacity="0"/>
  </radialGradient>
</defs>
<rect width="800" height="450" fill="#F0EEE6"/>
<rect width="800" height="450" fill="url(#glow)"/>
<text x="60" y="106" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#5E5D59">request 1</text>
<rect x="60" y="124" width="480" height="54" rx="8" fill="#141413" fill-opacity="0.28" stroke="#141413" stroke-width="2.5"/>
<text x="300" y="158" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#141413" text-anchor="middle" font-weight="600">stable prefix — read once</text>
<rect x="552" y="124" width="188" height="54" rx="8" fill="#FFFFFF" stroke="rgba(20,20,19,0.22)" stroke-width="2"/>
<text x="646" y="158" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#5E5D59" text-anchor="middle">question</text>
<text x="60" y="234" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#5E5D59">request 2</text>
<rect x="60" y="252" width="480" height="54" rx="8" fill="#141413" fill-opacity="0.1" stroke="#141413" stroke-opacity="0.55" stroke-width="2.5" stroke-dasharray="8 6"/>
<text x="300" y="286" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#141413" fill-opacity="0.85" text-anchor="middle">loaded, not re-read</text>
<rect x="552" y="252" width="188" height="54" rx="8" fill="#FFFFFF" stroke="rgba(20,20,19,0.22)" stroke-width="2"/>
<text x="646" y="286" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#5E5D59" text-anchor="middle">question</text>
<text x="60" y="366" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#5E5D59">it must match from the very first token</text>
<text x="52" y="418" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="25" font-weight="600" letter-spacing="2" fill="#141413" fill-opacity="0.9">prompt caching</text>
</svg>
