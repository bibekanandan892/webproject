<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="An AI agent loop: the model chooses an action, a tool runs, the observation returns to the model, and the cycle repeats until it produces an answer.">
<defs>
  <radialGradient id="glow" cx="50%" cy="14%" r="80%">
    <stop offset="0%" stop-color="#141413" stop-opacity="0.12"/>
    <stop offset="100%" stop-color="#141413" stop-opacity="0"/>
  </radialGradient>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#141413"/></marker>
</defs>
<rect width="800" height="450" fill="#F0EEE6"/>
<rect width="800" height="450" fill="url(#glow)"/>
<rect x="120" y="86" width="230" height="72" rx="10" fill="#141413" fill-opacity="0.22" stroke="#141413" stroke-width="2"/>
<text x="235" y="130" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" fill="#141413" text-anchor="middle" font-weight="600">model</text>
<rect x="120" y="252" width="230" height="72" rx="10" fill="#FFFFFF" stroke="rgba(20,20,19,0.14)" stroke-width="2"/>
<text x="235" y="296" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" fill="#5E5D59" text-anchor="middle">tool</text>
<path d="M200 158 V244" stroke="#141413" stroke-opacity="0.7" stroke-width="2.5" marker-end="url(#a)"/>
<path d="M272 244 V166" stroke="#141413" stroke-opacity="0.4" stroke-width="2.5" marker-end="url(#a)"/>
<text x="112" y="208" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#5E5D59" text-anchor="end">call</text>
<text x="360" y="208" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#5E5D59">result</text>
<path d="M350 122 H470" stroke="#141413" stroke-opacity="0.7" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#a)"/>
<text x="410" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#5E5D59" text-anchor="middle">done</text>
<rect x="486" y="86" width="200" height="72" rx="10" fill="#FFFFFF" stroke="#141413" stroke-opacity="0.5" stroke-width="2"/>
<text x="586" y="130" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" fill="#141413" text-anchor="middle">answer</text>
<text x="120" y="370" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#5E5D59">repeat until finished</text>
<text x="52" y="412" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="25" font-weight="600" letter-spacing="2" fill="#141413" fill-opacity="0.9">ai agents</text>
</svg>
