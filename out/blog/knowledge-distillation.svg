<rect x="332" y="120" width="150" height="26" rx="4" fill="#141413" fill-opacity="0.45" stroke="#141413" stroke-opacity="0.7" stroke-width="1.5"/>
<rect x="332" y="158" width="70" height="26" rx="4" fill="#141413" fill-opacity="0.32" stroke="#141413" stroke-opacity="0.6" stroke-width="1.5"/>
<rect x="332" y="196" width="52" height="26" rx="4" fill="#141413" fill-opacity="0.26" stroke="#141413" stroke-opacity="0.55" stroke-width="1.5"/>
<rect x="332" y="234" width="38" height="26" rx="4" fill="#141413" fill-opacity="0.2" stroke="#141413" stroke-opacity="0.5" stroke-width="1.5"/>
<rect x="332" y="272" width="30" height="26" rx="4" fill="#141413" fill-opacity="0.16" stroke="#141413" stroke-opacity="0.45" stroke-width="1.5"/>
