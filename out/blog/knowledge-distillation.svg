<text x="643" y="204" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" fill="#141413" text-anchor="middle" font-weight="600">student</text>
<text x="60" y="360" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#5E5D59">the near misses are the lesson</text>
<text x="52" y="416" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="25" font-weight="600" letter-spacing="2" fill="#141413" fill-opacity="0.9">knowledge distillation</text>
