    <stop offset="0%" stop-color="#141413" stop-opacity="0.12"/>
    <stop offset="100%" stop-color="#141413" stop-opacity="0"/>
  </radialGradient>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#141413"/></marker>
</defs>
<rect width="800" height="450" fill="#F0EEE6"/>
<rect width="800" height="450" fill="url(#glow)"/>
<g stroke="rgba(20,20,19,0.08)" stroke-width="1.5" fill="#FFFFFF">
<rect x="60" y="80" width="52" height="52"/><rect x="116" y="80" width="52" height="52"/><rect x="172" y="80" width="52" height="52"/><rect x="228" y="80" width="52" height="52"/><rect x="284" y="80" width="52" height="52"/>
<rect x="60" y="136" width="52" height="52"/><rect x="116" y="136" width="52" height="52"/><rect x="172" y="136" width="52" height="52"/><rect x="228" y="136" width="52" height="52"/><rect x="284" y="136" width="52" height="52"/>
<rect x="60" y="192" width="52" height="52"/><rect x="116" y="192" width="52" height="52"/><rect x="172" y="192" width="52" height="52"/><rect x="228" y="192" width="52" height="52"/><rect x="284" y="192" width="52" height="52"/>
<rect x="60" y="248" width="52" height="52"/><rect x="116" y="248" width="52" height="52"/><rect x="172" y="248" width="52" height="52"/><rect x="228" y="248" width="52" height="52"/><rect x="284" y="248" width="52" height="52"/>
</g>
<g fill="#141413" fill-opacity="0.3" stroke="#141413" stroke-opacity="0.6" stroke-width="2">
<rect x="116" y="136" width="52" height="52"/><rect x="172" y="136" width="52" height="52"/><rect x="116" y="192" width="52" height="52"/><rect x="172" y="192" width="52" height="52"/>
</g>
<g fill="#5E5D59" fill-opacity="0.22" stroke="#5E5D59" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="5 4">
<rect x="228" y="80" width="52" height="52"/><rect x="60" y="248" width="52" height="52"/><rect x="284" y="192" width="52" height="52"/>
</g>
<text x="60" y="66" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#141413">visible</text>
<text x="230" y="66" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#5E5D59">hidden</text>
<path d="M356 190 H436" stroke="#141413" stroke-opacity="0.7" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="452" y="132" width="288" height="52" rx="8" fill="#141413" fill-opacity="0.28" stroke="#141413" stroke-width="2.5"/>
<text x="596" y="166" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#141413" text-anchor="middle" font-weight="600">predicted summary</text>
<rect x="452" y="200" width="288" height="52" rx="8" fill="#FFFFFF" stroke="rgba(20,20,19,0.18)" stroke-width="2"/>
<text x="596" y="234" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#5E5D59" text-anchor="middle">actual summary</text>
<text x="452" y="288" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#5E5D59">compare these — never the pixels</text>
<text x="52" y="414" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="25" font-weight="600" letter-spacing="2" fill="#141413" fill-opacity="0.9">jepa</text>
