<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Claude Code: a loop of gathering context, changing code and running tests, with failures feeding back in.">
<defs>
  <radialGradient id="glow" cx="50%" cy="14%" r="80%">
    <stop offset="0%" stop-color="#64FFDA" stop-opacity="0.12"/>
    <stop offset="100%" stop-color="#64FFDA" stop-opacity="0"/>
  </radialGradient>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64FFDA"/></marker>
  <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8B98A9"/></marker>
</defs>
<rect width="800" height="450" fill="#0F1626"/>
<rect width="800" height="450" fill="url(#glow)"/>
<rect x="60" y="122" width="180" height="70" rx="10" fill="#64FFDA" fill-opacity="0.26" stroke="#64FFDA" stroke-width="2.5"/>
<text x="150" y="164" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#64FFDA" text-anchor="middle">search</text>
<path d="M252 157 H308" stroke="#64FFDA" stroke-opacity="0.7" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="320" y="122" width="180" height="70" rx="10" fill="#64FFDA" fill-opacity="0.26" stroke="#64FFDA" stroke-width="2.5"/>
<text x="410" y="164" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#64FFDA" text-anchor="middle">edit</text>
<path d="M512 157 H568" stroke="#64FFDA" stroke-opacity="0.7" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="580" y="122" width="160" height="70" rx="10" fill="#64FFDA" fill-opacity="0.32" stroke="#64FFDA" stroke-width="2.5"/>
<text x="660" y="164" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#64FFDA" text-anchor="middle" font-weight="600">run tests</text>
<path d="M660 204 V264 H150 V204" stroke="#8B98A9" stroke-opacity="0.55" stroke-width="2.5" fill="none" marker-end="url(#b)"/>
<text x="330" y="286" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#8B98A9">failed — go round again</text>
<text x="60" y="352" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#8B98A9">being wrong is detected, not shipped</text>
<text x="52" y="410" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="25" font-weight="600" letter-spacing="2" fill="#64FFDA" fill-opacity="0.9">claude code</text>
</svg>
