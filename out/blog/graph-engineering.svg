    <stop offset="0%" stop-color="#64FFDA" stop-opacity="0.12"/>
    <stop offset="100%" stop-color="#64FFDA" stop-opacity="0"/>
  </radialGradient>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64FFDA"/></marker>
  <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8B98A9"/></marker>
</defs>
<rect width="800" height="450" fill="#0F1626"/>
<rect width="800" height="450" fill="url(#glow)"/>
<g fill="#64FFDA" fill-opacity="0.26" stroke="#64FFDA" stroke-width="2.5">
<rect x="60" y="118" width="140" height="56" rx="9"/><rect x="226" y="118" width="120" height="56" rx="9"/><rect x="372" y="118" width="120" height="56" rx="9"/>
</g>
<rect x="518" y="118" width="130" height="56" rx="9" fill="#64FFDA" fill-opacity="0.38" stroke="#64FFDA" stroke-width="3"/>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#64FFDA" text-anchor="middle">
<text x="130" y="152">understand</text><text x="286" y="152">search</text><text x="432" y="152">write</text><text x="583" y="152" font-weight="600">check</text>
</g>
<path d="M212 146 H216" stroke="#64FFDA" stroke-opacity="0.8" stroke-width="2.5" marker-end="url(#a)"/>
<path d="M358 146 H362" stroke="#64FFDA" stroke-opacity="0.8" stroke-width="2.5" marker-end="url(#a)"/>
<path d="M504 146 H508" stroke="#64FFDA" stroke-opacity="0.8" stroke-width="2.5" marker-end="url(#a)"/>
<path d="M660 146 H710" stroke="#64FFDA" stroke-opacity="0.8" stroke-width="2.5" marker-end="url(#a)"/>
<text x="668" y="128" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#64FFDA">send</text>
<path d="M583 186 V232 H286 V180" stroke="#8B98A9" stroke-opacity="0.6" stroke-width="2.5" fill="none" marker-end="url(#b)"/>
<path d="M556 186 V268 H432 V180" stroke="#8B98A9" stroke-opacity="0.4" stroke-width="2.5" fill="none" marker-end="url(#b)"/>
<text x="300" y="226" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#8B98A9">nothing found</text>
<text x="446" y="262" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#8B98A9">too weak</text>
<text x="60" y="332" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#64FFDA">fifteen possible paths — all of them testable</text>
<text x="60" y="376" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#8B98A9">the model thinks; the graph decides where</text>
<text x="52" y="426" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="25" font-weight="600" letter-spacing="2" fill="#64FFDA" fill-opacity="0.9">graph engineering</text>
