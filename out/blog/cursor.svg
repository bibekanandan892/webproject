<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Cursor: three models of different sizes serving completion, chat and applying edits.">
<defs>
  <radialGradient id="glow" cx="50%" cy="14%" r="80%">
    <stop offset="0%" stop-color="#141413" stop-opacity="0.12"/>
    <stop offset="100%" stop-color="#141413" stop-opacity="0"/>
  </radialGradient>
</defs>
<rect width="800" height="450" fill="#F0EEE6"/>
<rect width="800" height="450" fill="url(#glow)"/>
<rect x="60" y="110" width="140" height="54" rx="8" fill="#141413" fill-opacity="0.32" stroke="#141413" stroke-width="2.5"/>
<text x="130" y="144" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#141413" text-anchor="middle" font-weight="600">small</text>
<text x="220" y="144" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#5E5D59">completion — 140 ms</text>
<rect x="60" y="192" width="340" height="54" rx="8" fill="#141413" fill-opacity="0.2" stroke="#141413" stroke-opacity="0.75" stroke-width="2.5"/>
<text x="230" y="226" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#141413" text-anchor="middle">large</text>
<text x="420" y="226" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#5E5D59">chat and agent — 1.2 s</text>
<rect x="60" y="274" width="140" height="54" rx="8" fill="#FFFFFF" stroke="rgba(20,20,19,0.26)" stroke-width="2.5"/>
<text x="130" y="308" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#5E5D59" text-anchor="middle">small</text>
<text x="220" y="308" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#5E5D59">applying the diff</text>
<path d="M60 78 H740" stroke="rgba(20,20,19,0.2)" stroke-width="2"/>
<path d="M131 70 V86" stroke="#141413" stroke-width="3"/>
<text x="60" y="62" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#141413">210 ms — the typing budget</text>
<text x="60" y="382" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#5E5D59">the budget picks the model, not the other way round</text>
<text x="52" y="426" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="25" font-weight="600" letter-spacing="2" fill="#141413" fill-opacity="0.9">cursor</text>
</svg>
