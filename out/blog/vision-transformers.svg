<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Vision transformer: an image cut into a grid of patches on the left becomes a row of tokens on the right, beginning with a highlighted class token.">
<defs>
