<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Endpointing: speech segments separated by pauses, each pause marked with a question — end of turn or not?">
<defs>
  <radialGradient id="glow" cx="50%" cy="14%" r="80%">
    <stop offset="0%" stop-color="#141413" stop-opacity="0.12"/>
    <stop offset="100%" stop-color="#141413" stop-opacity="0"/>
  </radialGradient>
</defs>
<rect width="800" height="450" fill="#F0EEE6"/>
<rect width="800" height="450" fill="url(#glow)"/>
<g fill="#5E5D59" fill-opacity="0.4"><rect x="60" y="150" width="140" height="50" rx="8"/><rect x="250" y="150" width="190" height="50" rx="8"/><rect x="480" y="150" width="90" height="50" rx="8"/></g>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="26" fill="#5E5D59" text-anchor="middle"><text x="225" y="134">?</text><text x="460" y="134">?</text></g>
<rect x="590" y="140" width="150" height="70" rx="10" fill="none" stroke="#141413" stroke-width="3" stroke-dasharray="7 5"/>
<text x="665" y="134" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="26" fill="#141413" text-anchor="middle">?</text>
<text x="665" y="182" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#141413" text-anchor="middle">end of turn</text>
<text x="60" y="372" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#5E5D59">300 ms: right 67.5% of the time it fires</text>
<text x="52" y="424" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="25" font-weight="600" letter-spacing="2" fill="#141413" fill-opacity="0.9">endpointing</text>
</svg>
