    <stop offset="0%" stop-color="#141413" stop-opacity="0.12"/>
    <stop offset="100%" stop-color="#141413" stop-opacity="0"/>
  </radialGradient>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5E5D59"/></marker>
</defs>
<rect width="800" height="450" fill="#F0EEE6"/>
<rect width="800" height="450" fill="url(#glow)"/>
<text x="60" y="106" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#5E5D59">direct</text>
<rect x="60" y="124" width="130" height="50" rx="7" fill="#FFFFFF" stroke="rgba(20,20,19,0.16)" stroke-width="2"/>
<text x="125" y="156" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#5E5D59" text-anchor="middle">ask</text>
<path d="M196 149 H222" stroke="#5E5D59" stroke-opacity="0.55" stroke-width="2" marker-end="url(#a)"/>
<rect x="230" y="124" width="130" height="50" rx="7" fill="#141413" fill-opacity="0.32" stroke="#141413" stroke-width="2.5"/>
<text x="295" y="156" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#141413" text-anchor="middle">answer</text>
<text x="60" y="256" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#141413">reasoning</text>
<rect x="60" y="274" width="130" height="50" rx="7" fill="#FFFFFF" stroke="rgba(20,20,19,0.16)" stroke-width="2"/>
<text x="125" y="306" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#5E5D59" text-anchor="middle">ask</text>
<path d="M196 299 H222" stroke="#5E5D59" stroke-opacity="0.55" stroke-width="2" marker-end="url(#a)"/>
<rect x="230" y="274" width="380" height="50" rx="7" fill="#141413" fill-opacity="0.14" stroke="#141413" stroke-opacity="0.5" stroke-width="2" stroke-dasharray="7 5"/>
<text x="420" y="306" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#141413" text-anchor="middle">thinking</text>
<path d="M616 299 H642" stroke="#5E5D59" stroke-opacity="0.55" stroke-width="2" marker-end="url(#a)"/>
<rect x="650" y="274" width="90" height="50" rx="7" fill="#141413" fill-opacity="0.32" stroke="#141413" stroke-width="2.5"/>
<text x="695" y="306" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#141413" text-anchor="middle">answer</text>
<text x="52" y="412" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="25" font-weight="600" letter-spacing="2" fill="#141413" fill-opacity="0.9">large reasoning models</text>
</svg>
