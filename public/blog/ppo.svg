<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="PPO: an objective curve that rises and then flattens once the policy ratio moves past the clipping bound.">
<defs>
  <radialGradient id="glow" cx="50%" cy="14%" r="80%">
    <stop offset="0%" stop-color="#141413" stop-opacity="0.12"/>
    <stop offset="100%" stop-color="#141413" stop-opacity="0"/>
  </radialGradient>
</defs>
<rect width="800" height="450" fill="#F0EEE6"/>
<rect width="800" height="450" fill="url(#glow)"/>
<path d="M80 320 H740" stroke="rgba(20,20,19,0.09)" stroke-width="1.5"/>
<path d="M420 80 V352" stroke="rgba(20,20,19,0.14)" stroke-width="2" stroke-dasharray="6 5"/>
<path d="M80 274 L150 258 L220 242 L290 226 L360 210 L420 196 L490 196 L560 196 L630 196 L700 196 L740 196"
      fill="none" stroke="#141413" stroke-opacity="0.85" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="420" cy="196" r="9" fill="#141413"/>
<text x="440" y="150" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#141413">clipped — no</text>
<text x="440" y="178" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#141413">further gain</text>
<text x="80" y="368" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#5E5D59">how far the policy moved →</text>
<text x="80" y="256" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#5E5D59" text-anchor="end">L</text>
<text x="52" y="412" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="25" font-weight="600" letter-spacing="2" fill="#141413" fill-opacity="0.9">ppo</text>
</svg>
