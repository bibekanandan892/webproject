<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="InstructGPT: three stages — written demonstrations, a reward model trained on rankings, and reinforcement learning with a drift penalty.">
<defs>
  <radialGradient id="glow" cx="50%" cy="14%" r="80%">
    <stop offset="0%" stop-color="#64FFDA" stop-opacity="0.12"/>
    <stop offset="100%" stop-color="#64FFDA" stop-opacity="0"/>
  </radialGradient>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64FFDA"/></marker>
</defs>
<rect width="800" height="450" fill="#0F1626"/>
<rect width="800" height="450" fill="url(#glow)"/>
<rect x="60" y="128" width="190" height="76" rx="10" fill="#64FFDA" fill-opacity="0.3" stroke="#64FFDA" stroke-width="2.5"/>
<text x="155" y="162" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#64FFDA" text-anchor="middle" font-weight="600">show it</text>
<text x="155" y="187" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#64FFDA" fill-opacity="0.8" text-anchor="middle">13,000 answers</text>
<path d="M262 166 H300" stroke="#64FFDA" stroke-opacity="0.7" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="312" y="128" width="190" height="76" rx="10" fill="#64FFDA" fill-opacity="0.22" stroke="#64FFDA" stroke-opacity="0.8" stroke-width="2.5"/>
<text x="407" y="162" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#64FFDA" text-anchor="middle">judge it</text>
<text x="407" y="187" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#64FFDA" fill-opacity="0.8" text-anchor="middle">rank, 36 pairs from 9</text>
<path d="M514 166 H552" stroke="#64FFDA" stroke-opacity="0.7" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="564" y="128" width="176" height="76" rx="10" fill="#64FFDA" fill-opacity="0.14" stroke="#64FFDA" stroke-opacity="0.65" stroke-width="2.5"/>
<text x="652" y="162" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#64FFDA" text-anchor="middle">optimise</text>
<text x="652" y="187" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#64FFDA" fill-opacity="0.8" text-anchor="middle">minus drift</text>
<text x="60" y="266" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#8B98A9">175B parameters, unaligned</text>
<rect x="60" y="278" width="404" height="22" rx="4" fill="#8B98A9" fill-opacity="0.22" stroke="rgba(230,237,243,0.26)" stroke-width="2"/>
<text x="60" y="330" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#64FFDA">1.3B, aligned — and preferred</text>
<rect x="60" y="342" width="4" height="22" rx="2" fill="#64FFDA"/>
<text x="60" y="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#8B98A9">the capability was already there</text>
<text x="52" y="436" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="25" font-weight="600" letter-spacing="2" fill="#64FFDA" fill-opacity="0.9">decoding instructgpt</text>
</svg>
