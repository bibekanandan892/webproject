<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Barge-in: the agent's speech waveform cut off sharply where the user's speech begins.">
<defs>
  <radialGradient id="glow" cx="50%" cy="14%" r="80%">
    <stop offset="0%" stop-color="#141413" stop-opacity="0.12"/>
    <stop offset="100%" stop-color="#141413" stop-opacity="0"/>
  </radialGradient>
</defs>
<rect width="800" height="450" fill="#F0EEE6"/>
<rect width="800" height="450" fill="url(#glow)"/>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19">
<text x="60" y="120" fill="#5E5D59">agent</text><text x="60" y="250" fill="#141413">user</text>
</g>
<path d="M150 140 l10 -30 l10 50 l10 -40 l10 30 l10 -20 l10 40 l10 -50 l10 30 l10 -20 l10 40 l10 -30 l10 20 l10 -40 l10 50 l10 -30 l10 20 l10 -20 l10 30 l10 -40 l10 50 l10 -30 l10 10 l10 -10" fill="none" stroke="#5E5D59" stroke-width="3"/>
<path d="M390 140 l10 -20 l10 30 l10 -10" fill="none" stroke="#5E5D59" stroke-opacity="0.35" stroke-width="3" stroke-dasharray="4 4"/>
<path d="M380 80 V300" stroke="#141413" stroke-width="3"/>
<path d="M380 270 l10 -40 l10 60 l10 -50 l10 40 l10 -30 l10 50 l10 -60 l10 40 l10 -30 l10 50 l10 -40 l10 30 l10 -20 l10 40 l10 -50 l10 30 l10 -10" fill="none" stroke="#141413" stroke-width="3.5"/>
<text x="60" y="372" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#5E5D59">stop, flush, and forget the unsaid words</text>
<text x="52" y="424" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="25" font-weight="600" letter-spacing="2" fill="#141413" fill-opacity="0.9">barge-in</text>
</svg>
