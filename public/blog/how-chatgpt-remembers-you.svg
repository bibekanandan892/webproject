<rect x="420" y="70" width="320" height="36" rx="7"/><rect x="420" y="160" width="320" height="36" rx="7"/><rect x="420" y="206" width="320" height="36" rx="7"/><rect x="420" y="252" width="320" height="36" rx="7"/>
