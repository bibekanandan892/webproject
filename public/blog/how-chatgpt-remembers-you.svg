<rect x="60" y="132" width="230" height="40" rx="8" fill="#FFFFFF" stroke="#141413" stroke-width="2"/><text x="76" y="158">data engineer</text>
<rect x="60" y="184" width="230" height="40" rx="8" fill="#FFFFFF" stroke="#141413" stroke-width="2"/><text x="76" y="210">dog called Biscuit</text>
