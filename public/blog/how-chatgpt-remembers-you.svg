<rect x="420" y="114" width="320" height="38" rx="7" fill="#141413" fill-opacity="0.75"/>
<text x="436" y="139" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#F0EEE6">memory block</text>
<text x="60" y="372" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#5E5D59">the model forgets; the prompt remembers</text>
