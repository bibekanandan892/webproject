<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Agentic RAG: an agent sits between the question and the answer, calling retrieval tools repeatedly and judging what comes back before answering.">
<defs>
  <radialGradient id="glow" cx="45%" cy="14%" r="80%">
    <stop offset="0%" stop-color="#64FFDA" stop-opacity="0.12"/>
    <stop offset="100%" stop-color="#64FFDA" stop-opacity="0"/>
  </radialGradient>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8B98A9"/></marker>
</defs>
<rect width="800" height="450" fill="#0F1626"/>
<rect width="800" height="450" fill="url(#glow)"/>
<rect x="50" y="150" width="150" height="58" rx="9" fill="#141C30" stroke="rgba(230,237,243,0.16)" stroke-width="2"/>
<text x="125" y="186" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#8B98A9" text-anchor="middle">question</text>
<rect x="290" y="150" width="180" height="58" rx="9" fill="#64FFDA" fill-opacity="0.26" stroke="#64FFDA" stroke-width="2"/>
<text x="380" y="186" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" fill="#64FFDA" text-anchor="middle" font-weight="600">agent</text>
<rect x="290" y="268" width="180" height="58" rx="9" fill="#141C30" stroke="#64FFDA" stroke-opacity="0.45" stroke-width="2"/>
<text x="380" y="304" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#64FFDA" text-anchor="middle">search</text>
<rect x="560" y="150" width="180" height="58" rx="9" fill="#141C30" stroke="rgba(230,237,243,0.16)" stroke-width="2"/>
<text x="650" y="186" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#8B98A9" text-anchor="middle">answer</text>
<path d="M200 179 H282" stroke="#8B98A9" stroke-opacity="0.55" stroke-width="2" marker-end="url(#a)"/>
<path d="M470 179 H552" stroke="#8B98A9" stroke-opacity="0.55" stroke-width="2" marker-end="url(#a)"/>
<path d="M350 208 V260" stroke="#64FFDA" stroke-opacity="0.6" stroke-width="2" marker-end="url(#a)"/>
<path d="M410 260 V216" stroke="#64FFDA" stroke-opacity="0.6" stroke-width="2" marker-end="url(#a)"/>
<text x="496" y="298" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#8B98A9">again if</text>
<text x="496" y="326" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#8B98A9">not good enough</text>
<text x="52" y="412" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="25" font-weight="600" letter-spacing="2" fill="#64FFDA" fill-opacity="0.9">agentic rag</text>
</svg>
