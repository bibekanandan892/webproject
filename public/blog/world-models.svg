<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="World model: an agent rolling an imagined trajectory forward, with the path drifting further from the real one at each step.">
<defs>
  <radialGradient id="glow" cx="50%" cy="14%" r="80%">
    <stop offset="0%" stop-color="#141413" stop-opacity="0.12"/>
    <stop offset="100%" stop-color="#141413" stop-opacity="0"/>
  </radialGradient>
</defs>
<rect width="800" height="450" fill="#F0EEE6"/>
<rect width="800" height="450" fill="url(#glow)"/>
<path d="M80 220 H720" stroke="#5E5D59" stroke-opacity="0.45" stroke-width="3"/>
<text x="80" y="196" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#5E5D59">what really happens</text>
<path d="M80 220 L160 218 L240 212 L320 200 L400 178 L480 142 L560 90" stroke="#141413" stroke-width="3.5" fill="none"/>
<g fill="#141413">
<circle cx="80" cy="220" r="7"/><circle cx="160" cy="218" r="7"/><circle cx="240" cy="212" r="7"/><circle cx="320" cy="200" r="7"/><circle cx="400" cy="178" r="7"/><circle cx="480" cy="142" r="7"/><circle cx="560" cy="90" r="7"/>
</g>
<text x="440" y="288" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#141413">what it imagines</text>
<path d="M470 274 L520 216" stroke="#141413" stroke-opacity="0.6" stroke-width="2"/>
<text x="60" y="352" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#5E5D59">every step is built on a slightly wrong one</text>
<text x="52" y="412" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="25" font-weight="600" letter-spacing="2" fill="#141413" fill-opacity="0.9">world models</text>
</svg>
