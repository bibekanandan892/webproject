<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Dynamic endpointing: three speech tracks with different pause lengths, each followed by a wait window sized to match.">
<defs>
  <radialGradient id="glow" cx="50%" cy="14%" r="80%">
    <stop offset="0%" stop-color="#141413" stop-opacity="0.12"/>
    <stop offset="100%" stop-color="#141413" stop-opacity="0"/>
  </radialGradient>
</defs>
<rect width="800" height="450" fill="#F0EEE6"/>
<rect width="800" height="450" fill="url(#glow)"/>
<g fill="#5E5D59" fill-opacity="0.4">
<rect x="60" y="90" width="90" height="36" rx="6"/><rect x="160" y="90" width="110" height="36" rx="6"/><rect x="280" y="90" width="80" height="36" rx="6"/>
<rect x="60" y="170" width="100" height="36" rx="6"/><rect x="180" y="170" width="120" height="36" rx="6"/><rect x="320" y="170" width="70" height="36" rx="6"/>
<rect x="60" y="250" width="110" height="36" rx="6"/><rect x="210" y="250" width="110" height="36" rx="6"/><rect x="360" y="250" width="80" height="36" rx="6"/>
</g>
<g fill="#141413" fill-opacity="0.12" stroke="#141413" stroke-width="2.5" stroke-dasharray="6 4">
<rect x="370" y="86" width="70" height="44" rx="6"/>
<rect x="400" y="166" width="100" height="44" rx="6"/>
<rect x="450" y="246" width="160" height="44" rx="6"/>
</g>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#141413">
<text x="456" y="114">350 ms</text><text x="516" y="194">500 ms</text><text x="626" y="274">800 ms</text>
</g>
<text x="60" y="372" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#5E5D59">wait as long as this speaker pauses</text>
<text x="52" y="424" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="25" font-weight="600" letter-spacing="2" fill="#141413" fill-opacity="0.9">dynamic endpointing</text>
</svg>
