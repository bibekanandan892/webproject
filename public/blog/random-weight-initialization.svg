<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Random weight initialisation: a column of identical grey neurons on the left, and a column of neurons with different shades and connection strengths on the right.">
<defs>
  <radialGradient id="glow" cx="50%" cy="14%" r="80%">
    <stop offset="0%" stop-color="#141413" stop-opacity="0.12"/>
    <stop offset="100%" stop-color="#141413" stop-opacity="0"/>
  </radialGradient>
</defs>
<rect width="800" height="450" fill="#F0EEE6"/>
<rect width="800" height="450" fill="url(#glow)"/>
<g fill="#5E5D59" fill-opacity="0.45"><circle cx="200" cy="90" r="26"/><circle cx="200" cy="160" r="26"/><circle cx="200" cy="230" r="26"/><circle cx="200" cy="300" r="26"/></g>
<text x="200" y="50" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#5E5D59" text-anchor="middle">all 0.5</text>
<g fill="#141413"><circle cx="560" cy="90" r="26" fill-opacity="0.85"/><circle cx="560" cy="160" r="26" fill-opacity="0.35"/><circle cx="560" cy="230" r="26" fill-opacity="0.6"/><circle cx="560" cy="300" r="26" fill-opacity="0.2"/></g>
<text x="560" y="50" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#141413" text-anchor="middle">random</text>
<g stroke="#141413" stroke-opacity="0.4" stroke-width="2.5"><path d="M300 195 H460"/><path d="M448 187 L462 195 L448 203" fill="none"/></g>
<text x="60" y="380" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#5E5D59">identical neurons stay identical</text>
<text x="52" y="424" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="25" font-weight="600" letter-spacing="2" fill="#141413" fill-opacity="0.9">random weight initialisation</text>
</svg>
