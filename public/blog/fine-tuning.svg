<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Fine-tuning: a general model trained further on narrow examples, changing its form while facts stay outside the weights.">
<defs>
  <radialGradient id="glow" cx="50%" cy="14%" r="80%">
    <stop offset="0%" stop-color="#64FFDA" stop-opacity="0.12"/>
    <stop offset="100%" stop-color="#64FFDA" stop-opacity="0"/>
  </radialGradient>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64FFDA"/></marker>
</defs>
<rect width="800" height="450" fill="#0F1626"/>
<rect width="800" height="450" fill="url(#glow)"/>
<rect x="60" y="128" width="180" height="80" rx="10" fill="#141C30" stroke="rgba(230,237,243,0.24)" stroke-width="2.5"/>
<text x="150" y="175" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#8B98A9" text-anchor="middle">general model</text>
<path d="M252 168 H308" stroke="#64FFDA" stroke-opacity="0.7" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="320" y="128" width="180" height="80" rx="10" fill="#64FFDA" fill-opacity="0.3" stroke="#64FFDA" stroke-width="2.5"/>
<text x="410" y="163" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#64FFDA" text-anchor="middle" font-weight="600">your examples</text>
<text x="410" y="189" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#64FFDA" fill-opacity="0.8" text-anchor="middle">form, not facts</text>
<path d="M512 168 H568" stroke="#64FFDA" stroke-opacity="0.7" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="580" y="128" width="160" height="80" rx="10" fill="#64FFDA" fill-opacity="0.18" stroke="#64FFDA" stroke-opacity="0.7" stroke-width="2.5"/>
<text x="660" y="175" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#64FFDA" text-anchor="middle">specialist</text>
<rect x="230" y="262" width="340" height="56" rx="9" fill="#141C30" stroke="rgba(230,237,243,0.2)" stroke-width="2" stroke-dasharray="7 6"/>
<text x="400" y="296" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#8B98A9" text-anchor="middle">facts stay out here, retrievable</text>
<path d="M660 218 V262 H578" stroke="#8B98A9" stroke-opacity="0.5" stroke-width="2" fill="none"/>
<text x="60" y="376" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#8B98A9">weights cannot be corrected, only retrained</text>
<text x="52" y="422" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="25" font-weight="600" letter-spacing="2" fill="#64FFDA" fill-opacity="0.9">fine-tuning</text>
</svg>
