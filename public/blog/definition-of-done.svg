<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Definition of done: a loop attempting work and a checker gating the exit, with the checker drawn as the narrow point.">
<defs>
  <radialGradient id="glow" cx="50%" cy="14%" r="80%">
    <stop offset="0%" stop-color="#64FFDA" stop-opacity="0.12"/>
    <stop offset="100%" stop-color="#64FFDA" stop-opacity="0"/>
  </radialGradient>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64FFDA"/></marker>
  <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8B98A9"/></marker>
</defs>
<rect width="800" height="450" fill="#0F1626"/>
<rect width="800" height="450" fill="url(#glow)"/>
<rect x="60" y="126" width="180" height="64" rx="10" fill="#141C30" stroke="rgba(230,237,243,0.24)" stroke-width="2.5"/>
<text x="150" y="164" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#8B98A9" text-anchor="middle">attempt</text>
<path d="M252 158 H320" stroke="#64FFDA" stroke-opacity="0.75" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="332" y="118" width="150" height="80" rx="10" fill="#64FFDA" fill-opacity="0.34" stroke="#64FFDA" stroke-width="3"/>
<text x="407" y="152" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#64FFDA" text-anchor="middle" font-weight="600">the checker</text>
<text x="407" y="178" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#64FFDA" fill-opacity="0.8" text-anchor="middle">pass / fail</text>
<path d="M494 146 H562" stroke="#64FFDA" stroke-opacity="0.75" stroke-width="2.5" marker-end="url(#a)"/>
<rect x="574" y="122" width="166" height="48" rx="8" fill="#64FFDA" fill-opacity="0.18" stroke="#64FFDA" stroke-opacity="0.65" stroke-width="2"/>
<text x="657" y="152" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#64FFDA" text-anchor="middle">done</text>
<path d="M407 210 V250 H150 V198" stroke="#8B98A9" stroke-opacity="0.55" stroke-width="2.5" fill="none" marker-end="url(#b)"/>
<text x="180" y="244" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#8B98A9">try again</text>
<path d="M500 182 H562" stroke="#8B98A9" stroke-opacity="0.35" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#b)"/>
<rect x="574" y="188" width="166" height="42" rx="8" fill="#141C30" stroke="rgba(230,237,243,0.18)" stroke-width="2" stroke-dasharray="6 5"/>
<text x="657" y="215" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#8B98A9" text-anchor="middle">wrong, but passed</text>
<text x="60" y="322" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#8B98A9">the loop stops on the checker, not on being right</text>
<text x="60" y="370" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#64FFDA">so the checker is the ceiling</text>
<text x="52" y="422" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="25" font-weight="600" letter-spacing="2" fill="#64FFDA" fill-opacity="0.9">definition of done</text>
</svg>
