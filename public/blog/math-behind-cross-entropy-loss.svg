<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="Cross-entropy loss: a curve that is near zero when the model gives high probability to the right answer and rises steeply as that probability approaches zero.">
<defs>
  <radialGradient id="glow" cx="22%" cy="14%" r="82%">
    <stop offset="0%" stop-color="#64FFDA" stop-opacity="0.13"/>
    <stop offset="100%" stop-color="#64FFDA" stop-opacity="0"/>
  </radialGradient>
</defs>
<rect width="800" height="450" fill="#0F1626"/>
<rect width="800" height="450" fill="url(#glow)"/>

<!-- axes -->
<path d="M110 320 H730" stroke="rgba(230,237,243,0.09)" stroke-width="1.5"/>
<path d="M110 70 V320" stroke="rgba(230,237,243,0.09)" stroke-width="1.5"/>

<!-- -log(p) curve -->
<path d="M120 78 L132 122 L146 155 L162 181 L180 202 L200 219 L222 233 L246 245 L272 255 L300 264 L330 271 L362 278 L396 284 L432 290 L470 296 L510 301 L552 306 L596 310 L642 314 L690 317 L730 320"
      fill="none" stroke="#64FFDA" stroke-opacity="0.65" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>

<!-- confident and wrong -->
<circle cx="132" cy="122" r="10" fill="#64FFDA" fill-opacity="0.9"/>
<text x="158" y="118" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#64FFDA">confident and wrong</text>

<!-- confident and right -->
<circle cx="690" cy="317" r="10" fill="#64FFDA" fill-opacity="0.55"/>
<text x="666" y="298" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#8B98A9" text-anchor="end">confident and right</text>

<text x="110" y="58" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#8B98A9">loss</text>
<text x="730" y="346" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21" fill="#8B98A9" text-anchor="end">belief in the truth →</text>

<text x="52" y="412" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="25" font-weight="600" letter-spacing="2" fill="#64FFDA" fill-opacity="0.9">cross-entropy loss</text>
</svg>
